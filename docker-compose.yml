services:
  weatherwise:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weatherwise-app
    ports:
      - "8090:8080"
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: weatherwise-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: change_this_root_password
      MYSQL_DATABASE: weatherwise
      MYSQL_USER: weatheruser
      MYSQL_PASSWORD: change_this_app_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pchange_this_root_password"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
